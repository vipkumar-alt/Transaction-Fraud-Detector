server:
  port: 8080

spring:
  application:
    name: fraud-rag-system

  datasource:
    url: jdbc:postgresql://localhost:5433/fraud_rag_db
#    username: postgres
#    password: postgres

    username: fraud_user
    password: fraud_pass

  ai:
    model:
      embedding:
        text: vertexai
      chat: vertexai

    vertex:
      ai:
        embedding:
          project-id: gd-gcp-internship-ui
          location: us-central1
          text:
            options:
              model: text-embedding-004

        gemini:
          project-id: gd-gcp-internship-ui
          location: us-central1
          chat:
            options:
              model: gemini-2.5-flash
              temperature: 0.2

logging:
  level:
    com.project.fraudsystem: DEBUG
    org.springframework.ai: DEBUG